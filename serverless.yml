service: coffeetimecmswebsite

variablesResolutionMode: 20210326

plugins:
  - serverless-s3-deploy
  - serverless-s3-remover
  - serverless-cloudfront-invalidate

custom:
  baseName: ${self:service}-${self:provider.stage}

  assets:
    auto: true
    targets:
      - bucket: !Ref WebsiteBucket
        empty: true
        files:
          - source: dist
            globs: '**/*'

  remover:
    buckets:
      - ${cf:${self:custom.baseName}.WebsiteBucketName, ''}

  cloudfrontInvalidate:
    - distributionIdKey: WebsiteDistributionId
      items:
        - "/*"

provider:
  name: aws
  region: af-south-1
  stage: ${opt:stage, 'prod'}
  deploymentBucket:
    blockPublicAccess: true
  disableDefaultOutputExportNames: true

resources:
  Resources:

    # S3
    WebsiteBucket:
      Type: AWS::S3::Bucket
      Properties:
        WebsiteConfiguration:
          IndexDocument: index.html

    WebsiteBucketAccessPolicy:
      Type: AWS::S3::BucketPolicy
      Properties:
        Bucket: !Ref WebsiteBucket
        PolicyDocument:
          Statement:
            - Action: s3:GetObject
              Effect: Allow
              Resource: !Sub ${WebsiteBucket.Arn}/*
              Principal: '*'

    # CLOUDFRONT
    WebsiteDistribution:
      Type: AWS::CloudFront::Distribution
      Properties:
        DistributionConfig:
          Enabled: true
          Comment: ${self:custom.baseName}
          PriceClass: PriceClass_100
          HttpVersion: http2
          Origins:
            - Id: websiteS3
              DomainName: !Select [ 2, !Split [ '/', !GetAtt 'WebsiteBucket.WebsiteURL' ] ]
              CustomOriginConfig:
                OriginProtocolPolicy: http-only
          DefaultCacheBehavior:
            TargetOriginId: websiteS3
            AllowedMethods:
              - GET
              - HEAD
            CachedMethods:
              - GET
              - HEAD
            Compress: true
            ViewerProtocolPolicy: redirect-to-https
            ForwardedValues:
              QueryString: false
              Cookies:
                Forward: none

  Outputs:
    WebsiteBucketName:
      Value: !Ref WebsiteBucket

    WebsiteDistributionId:
      Value: !Ref WebsiteDistribution
