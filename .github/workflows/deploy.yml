name: deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:
  repository_dispatch:

concurrency: deploy-main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Application
        run: npm run build
